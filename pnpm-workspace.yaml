packages:
  # Product code: one folder for each package.
  - "packages/*"
  # The agent skills and their tooling.
  - "tooling/*"
  # The roadmap renderer.
  - "plans"

# The type check of the site (astro check) runs a WebAssembly module. Without
# wasm32 here, pnpm skips the WebAssembly runtime that the module needs.
supportedArchitectures:
  cpu:
    - current
    - wasm32
